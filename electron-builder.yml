{
  "appId": "com.lemo.treasure-chest",
  "productName": "袖里乾坤",
  "publish": [
    {
      "provider": "github",
      "owner": "lemo-ai",
      "repo": "treasure-chest",
      "releaseType": "release"
    }
  ],
  "directories": {
    "output": "release",
    "buildResources": "resources"
  },
  "asar": true,
  "asarUnpack": [
    "**/node_modules/ffmpeg-static/**",
    "**/node_modules/ffprobe-static/**"
  ],
  "files": [
    "out/**/*",
    "resources/**/*",
    "package.json",
    "node_modules/ffmpeg-static/**/*",
    "node_modules/ffprobe-static/**/*"
  ],
  "mac": {
    "icon": "resources/icon.icns",
    "target": [
      { "target": "dmg", "arch": ["x64", "arm64"] }
    ],
    "category": "public.app-category.utilities"
  },
  "win": {
    "icon": "resources/icon.png",
    "target": [
      { "target": "nsis", "arch": ["x64"] }
    ]
  },
  "linux": {
    "icon": "resources/icon.png",
    "maintainer": "edy <edy@local>",
    "target": [
      { "target": "AppImage", "arch": ["x64"] },
      { "target": "deb", "arch": ["x64"] }
    ],
    "category": "Utility"
  },
  "npmRebuild": true,
  "nodeGypRebuild": false,
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true
  }
}
