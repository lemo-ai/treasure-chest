{
  "appId": "com.lemo.treasure-chest",
  "productName": "袖里乾坤",
  "artifactName": "treasure-chest-${version}-${arch}.${ext}",
  "publish": [
    {
      "provider": "github",
      "owner": "lemo-ai",
      "repo": "treasure-chest",
      "releaseType": "release"
    }
  ],
  "directories": {
    "output": "release",
    "buildResources": "resources"
  },
  "asar": true,
  "asarUnpack": [
    "**/node_modules/ffmpeg-static/**",
    "**/node_modules/ffprobe-static/**"
  ],
  "files": [
    "out/**/*",
    "resources/**/*",
    "package.json",
    "node_modules/ffmpeg-static/**/*",
    "node_modules/ffprobe-static/**/*"
  ],
  "mac": {
    "icon": "resources/icon.icns",
    "target": [
      { "target": "dmg", "arch": ["x64", "arm64"] },
      { "target": "zip", "arch": ["x64", "arm64"] }
    ],
    "category": "public.app-category.utilities",
    "hardenedRuntime": false,
    "gatekeeperAssess": false,
    "entitlements": "resources/entitlements.mac.plist",
    "entitlementsInherit": "resources/entitlements.mac.plist",
    "extendInfo": {
      "NSMicrophoneUsageDescription": "Workbench voice input uses on-device speech recognition when available. Audio stays on this Mac unless the OS speech service requires network."
    },
    "artifactName": "treasure-chest-${version}-${arch}.${ext}"
  },
  "afterPack": "scripts/afterPack.js",
  "afterSign": "scripts/notarize.js",
  "win": {
    "icon": "resources/icon.png",
    "target": [
      { "target": "nsis", "arch": ["x64"] }
    ],
    "artifactName": "treasure-chest-setup-${version}.${ext}"
  },
  "linux": {
    "icon": "resources/icon.png",
    "maintainer": "edy <edy@local>",
    "target": [
      { "target": "AppImage", "arch": ["x64"] },
      { "target": "deb", "arch": ["x64"] }
    ],
    "category": "Utility",
    "artifactName": "treasure-chest-${version}-${arch}.${ext}"
  },
  "npmRebuild": true,
  "nodeGypRebuild": false,
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "artifactName": "treasure-chest-setup-${version}.${ext}"
  }
}
